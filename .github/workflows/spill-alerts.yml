name: Branksome spill alerts

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub may run it late at busy times)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # to commit alerts/state.json when the status changes

concurrency:
  group: spill-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Branksome and alert on change
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: node alerts/check-branksome.mjs
      - name: Save state if it changed
        run: |
          if [ -n "$(git status --porcelain alerts/state.json)" ]; then
            git config user.name "coast-watch-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alerts/state.json
            git commit -m "Spill alert state: $(node -p "require('./alerts/state.json').kind")"
            git push
          fi
